<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lettera a Boddah — Reader v0.2</title>
<style>
body{margin:0;background:#f4f0e8;color:#211f1c;font-family:Georgia,serif}
header{padding:1rem 2rem;border-bottom:1px solid #d8cdbb}
.hero{text-align:center;padding:4rem 1rem 2rem}
h1{font-size:4rem;margin:.5rem}
.reader{max-width:900px;margin:2rem auto;background:white;border:1px solid #ddd;border-radius:16px;padding:2rem}
button{padding:.6rem 1rem;border-radius:20px;border:1px solid #ccc;background:white;cursor:pointer}
button.active{background:#211f1c;color:white}
.line{margin:.8rem 0;font-size:1.2rem}
.num{color:#999;font-size:.8rem;margin-right:1rem}
.entity{background:#e8d7c8;border-radius:4px;padding:2px 5px;cursor:pointer}
.panel{display:none;position:fixed;right:20px;top:100px;width:300px;background:white;border:1px solid #ccc;border-radius:12px;padding:1rem;box-shadow:0 10px 30px #0002}
</style>
</head>
<body>
<header>Edizione digitale <strong>Lettera a Boddah</strong></header>
<section class="hero">
<div>KURT COBAIN</div>
<h1>Lettera a Boddah</h1>
<p>Reader sperimentale derivato direttamente dal TEI dell'edizione.</p>
</section>

<div class="reader">
<button class="active" id="diplomatic">Trascrizione diplomatica</button>
<button id="translation">Traduzione italiana</button>
<div id="lines"></div>
</div>

<div class="panel" id="panel">
<button onclick="closePanel()">×</button>
<h3>Freddie Mercury</h3>
<p>Cantante e musicista britannico.</p>
<p>Riferimento culturale presente nella lettera.</p>
<p>ID TEI: freddie-mercury</p>
<p>Wikidata: Q15869</p>
</div>

<script>
const lines=[
"To Boddah pronounced",
"Speaking from the tongue of an experienced simpleton who obviously",
"would rather be an emasculated, infantile complain-ce. This note should",
"be pretty easy to understand. All the warnings from the punk rock 101",
"... for Freddie Mercury, who seemed to love, relish in the love and adoration from the crowd"
];

let italian=false;
const translations=[
"A Boddah pronunciato",
"Parlando con la lingua di un sempliciotto esperto che ovviamente",
"preferirebbe essere un lamentoso infantile ed evirato.",
"Questa nota dovrebbe essere abbastanza facile da capire.",
"... per Freddie Mercury, che sembrava amare l'amore e l'adorazione della folla"
];

function render(){
 const box=document.getElementById("lines");
 box.innerHTML="";
 (italian?translations:lines).forEach((l,i)=>{
   if(!italian && l.includes("Freddie Mercury")){
     l=l.replace("Freddie Mercury",'<span class="entity" onclick="openPanel()">Freddie Mercury</span>');
   }
   box.innerHTML+=`<div class="line"><span class="num">${i+1}</span>${l}</div>`;
 });
}
document.getElementById("diplomatic").onclick=()=>{italian=false;render()};
document.getElementById("translation").onclick=()=>{italian=true;render()};
function openPanel(){document.getElementById("panel").style.display="block"}
function closePanel(){document.getElementById("panel").style.display="none"}
render();
</script>
</body>
</html>
